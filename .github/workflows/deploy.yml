name: Test and Deploy Adventure Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Expand v16 platformer source
        run: base64 --decode platformer-v16.js.gz.b64 | gzip --decompress > platformer-v16.js

      - name: Expand v17 gameplay overlay
        run: base64 --decode v17-overlay.tar.gz.b64 | tar -xzf -

      - name: Activate v18 full gameplay base
        run: |
          cp index-v18.html index.html
          cp sw-v18.js sw.js
          cp manifest-v18.webmanifest manifest.webmanifest
          cp package-v18.json package.json

      - name: Expand v19 cinematic renderer
        run: base64 --decode visual-v19.js.gz.b64 | gzip --decompress > visual-v19.js

      - name: Reassemble and verify v22 boss renderer
        run: |
          pushd v22-renderer-parts
          sha256sum -c SHA256SUMS
          cat part00.b64 part01.b64 part02.b64 part03.b64 part04.b64 part05.b64 part06.b64 part07.b64 part08.b64 > ../visual-v22.rebuilt.gz.b64
          popd
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          text = Path('visual-v22.rebuilt.gz.b64').read_text()
          if hashlib.sha256(text.encode()).hexdigest() != 'c9b161aaebd0e415726a0940114c68f9e4866364d3c201ecf2f1e8c6a523f4fc':
              raise SystemExit('v22 concatenated Base64 SHA256 mismatch')
          packed = base64.b64decode(text, validate=True)
          if hashlib.sha256(packed).hexdigest() != '5439eb62aa9d274e0c692bd84685dd4dc49951d150df66d1800978a513c70eac':
              raise SystemExit('v22 gzip SHA256 mismatch')
          source = gzip.decompress(packed)
          if hashlib.sha256(source).hexdigest() != '9be83029e2d39f2a34791831c7edef3a19bbc1e997b12a18da58587b31e6e81d':
              raise SystemExit('v22 source SHA256 mismatch')
          Path('visual-v22.js').write_bytes(source)
          print('verified v22 renderer:', len(source), 'bytes')
          PY
          node --check visual-v22.js

      - name: Activate v22 full gameplay build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          text = text.replace('v18.css?v=18', 'v18.css?v=22')
          text = text.replace('</head>', '  <link rel="stylesheet" href="v21.css?v=21" />\n  <link rel="stylesheet" href="v22.css?v=22" />\n</head>')
          text = text.replace('./vendor/matter.min.js?v=18', './vendor/matter.min.js?v=22')
          text = text.replace('const build = "18"', 'const build = "22"')
          text = text.replace('./app-v18.js?v=18', './app-v22.js?v=22')
          p.write_text(text)

          p = Path('sw.js')
          text = p.read_text()
          text = text.replace('family-adventure-v18', 'family-adventure-v22')
          text = text.replace('./?v=18', './?v=22')
          text = text.replace('v18.css?v=18', 'v18.css?v=22')
          text = text.replace('"./app-v18.js?v=18",', '"./app-v22.js?v=22",\n  "./app-v19.js?v=19",\n  "./app-v18.js?v=18",\n  "./visual-v22.js?v=22",\n  "./visual-v21.js?v=21",\n  "./visual-v19.js?v=19",\n  "./v21.css?v=21",\n  "./v22.css?v=22",')
          text = text.replace('matter.min.js?v=18', 'matter.min.js?v=22')
          p.write_text(text)

          p = Path('manifest.webmanifest')
          text = p.read_text().replace('./?v=18', './?v=22')
          text = text.replace('"background_color": "#172033"', '"background_color": "#101028"')
          text = text.replace('"theme_color": "#172033"', '"theme_color": "#101028"')
          p.write_text(text)
          PY

      - name: Install pinned Matter.js
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run full gameplay regression suite
        run: npm test

      - name: Run v22 boss and celebration integration test
        run: |
          node --check visual-v19.js
          node --check visual-v21.js
          node --check visual-v22.js
          node --check app-v22.js
          node --input-type=module <<'NODE'
          import MatterPackage from 'matter-js';
          globalThis.Matter = MatterPackage;
          const { PlatformerScene } = await import('./platformer-v18.js?art-smoke=22');
          const { applyV19Graphics } = await import('./visual-v19.js?art-smoke=22');
          const { applyV22BossCelebration } = await import('./visual-v22.js?art-smoke=22');
          const memory = new Map();
          const engine = {
            store: { get(k,f){ return memory.has(k) ? memory.get(k) : f; }, set(k,v){ memory.set(k,v); } },
            pointer: { on() {} }, audio: { unlock() {}, ping() {} }
          };
          const scene = new PlatformerScene();
          scene.resize(900, 650, 1);
          scene.mount(engine);
          applyV19Graphics(scene);
          applyV22BossCelebration(scene);
          if (scene.visualVersion !== 22) throw new Error('v22 art patch did not apply');
          const gradient = { addColorStop() {} };
          const ctx = new Proxy({}, {
            get(target, prop) {
              if (prop === 'createLinearGradient' || prop === 'createRadialGradient') return () => gradient;
              if (prop === 'measureText') return () => ({ width: 0 });
              if (!(prop in target)) target[prop] = () => {};
              return target[prop];
            },
            set(target, prop, value) { target[prop] = value; return true; }
          });
          scene.render(ctx);
          const mid = scene.__v22?.midBoss;
          const final = scene.__v22?.finalBoss;
          if (!mid || mid.__bossTier !== 'mid') throw new Error('large mid-map boss missing');
          if (!final || final.__bossTier !== 'final') throw new Error('huge final boss missing');
          if (mid.__bossTier === final.__bossTier) throw new Error('boss tiers are not distinct');
          if (!(mid.maxHp >= 24 && final.maxHp >= 42 && final.maxHp > mid.maxHp)) throw new Error('boss HP tiers are wrong');
          const mx = mid.p?.x ?? mid.x;
          const fx = final.p?.x ?? final.x;
          if (Number.isFinite(mx) && Number.isFinite(fx) && !(fx > mx)) throw new Error('final boss is not after mid boss');
          if (scene.goal) {
            const gx = scene.goal.x ?? scene.goal.p?.x;
            if (Number.isFinite(gx) && Number.isFinite(fx) && Math.abs(gx - fx) > 900) throw new Error('final boss is not near the goal');
          }
          scene.drawHero(ctx, scene.hero, scene.heroConfig, true);
          scene.drawShip(ctx, scene.ship, scene.shipConfig, false);
          scene.drawVillain(ctx, mid);
          scene.drawVillain(ctx, final);

          scene.activeEntity = scene.hero;
          const before = scene.mapIndex;
          final.dead = true;
          scene.__v22.finalBossDefeated = true;
          const gw = 80, gh = 100;
          const gx = scene.hero.p.x - gw/2, gy = scene.hero.p.y - gh/2;
          scene.goal = { x: gx, y: gy, p: { x: gx, y: gy }, w: gw, h: gh };
          scene.update(1/60);
          const party = scene.__v22.celebration;
          if (!party?.active) throw new Error('goal did not trigger delayed celebration');
          if (party.croissants.length < 30) throw new Error('croissant rain is too sparse');
          if (!(party.timer >= 200)) throw new Error('celebration delay is missing');
          scene.drawHero(ctx, scene.hero, scene.heroConfig, true);
          scene.nextMap = () => { scene.mapIndex = (before + 1) % 3; };
          party.timer = 1;
          scene.update(1/60);
          if (scene.mapIndex === before) throw new Error('celebration did not automatically advance to next map');
          console.log('v22 dual-boss, large renderer and croissant celebration test passed');
          NODE
          grep -q 'Math.max(2.15' visual-v22.js
          grep -q 'HERO_DANCE1_22' visual-v22.js
          grep -q 'HERO_DANCE2_22' visual-v22.js
          grep -q 'Croissant Doom Dragon' visual-v22.js
          grep -q 'croissants: Array.from' visual-v22.js
          grep -q 'timer: 220' visual-v22.js
          grep -q "const candidates = \['advanceMap', 'nextMap'" visual-v22.js

      - name: Verify full-feature UI and gameplay survived
        run: |
          grep -q 'id="builderTray"' index.html
          grep -q 'id="movementBadges"' index.html
          grep -q 'id="killCount"' index.html
          grep -q 'id="heroDialog"' index.html
          grep -q 'id="shipDialog"' index.html
          grep -q 'data-power="fire"' index.html
          grep -q 'data-power="ice"' index.html
          grep -q 'data-power="lightning"' index.html
          grep -Eqi 'eraser' index.html
          grep -Eqi 'kill' platformer-v18.js platformer-v17.js platformer-v16.js
          grep -Eqi 'villain|skeleton|monster' platformer-v18.js platformer-v17.js platformer-v16.js
          grep -Eqi 'Matter' platformer-v18.js platformer-v17.js platformer-v16.js
          grep -Eqi 'builder|Inventor' platformer-v18.js index.html
          grep -Eqi 'Spring|Glide|Dash' platformer-v18.js platformer-v17.js platformer-v16.js index.html
          grep -q 'app-v22.js?v=22' index.html
          grep -q 'v22.css?v=22' index.html

      - name: Build Blind Is You v0.3
        run: python tools/upgrade_biy_v03.py

      - name: Activate Blind Is You v0.4
        run: |
          cat tools/blind-is-you-v04.part00.b64 tools/blind-is-you-v04.part01.b64 tools/blind-is-you-v04.part02.b64 tools/blind-is-you-v04.part03.b64 | base64 --decode | gzip --decompress > blind-is-you/index.html
          grep -q 'data-version="0.4"' blind-is-you/index.html
          grep -q "var VERSION='0.4'" blind-is-you/index.html
          grep -q 'function buildDifficultyTable' blind-is-you/index.html
          grep -q "calibrationPhase='homing'" blind-is-you/index.html

      - name: Activate Blind Is You v2.0 presentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('blind-is-you/index.html')
          text = p.read_text()
          text = re.sub(r'\s*<meta\s+name=["\']biy-presentation["\'][^>]*>\s*', '\n', text, flags=re.I)
          text = re.sub(r'\s*<link[^>]+href=["\'](?:\./)?v11\.css(?:\?[^"\']*)?["\'][^>]*>\s*', '\n', text, flags=re.I)
          text = re.sub(r'\s*<script[^>]+src=["\'](?:\./)?v11\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>\s*', '\n', text, flags=re.I)
          text = text.replace('</head>', '  <meta name="biy-presentation" content="2.0">\n  <link rel="stylesheet" href="v11.css?v=2.0.1">\n</head>')
          text = text.replace('</body>', '  <script src="v11.js?v=2.0.1"></script>\n</body>')
          p.write_text(text)
          PY
          grep -q 'name="biy-presentation" content="2.0"' blind-is-you/index.html
          grep -q 'v11.css?v=2.0.1' blind-is-you/index.html
          grep -q 'v11.js?v=2.0.1' blind-is-you/index.html
          test "$(grep -o 'v11.css' blind-is-you/index.html | wc -l)" -eq 1
          test "$(grep -o 'v11.js' blind-is-you/index.html | wc -l)" -eq 1
          grep -q "var VERSION='2.0'" blind-is-you/v11.js
          grep -q 'Blind Is You v2.0' blind-is-you/v11.css

      - name: Build static site
        run: |
          mkdir -p _site/vendor
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='*.gz.b64' \
            --exclude='*.part*.b64' \
            --exclude='v20-parts' \
            --exclude='v22-parts' \
            --exclude='v22-renderer-parts' \
            --exclude='v20-pixel-site.tar.gz.b64' \
            --exclude='v19-overlay.part*' \
            --exclude='index-v18.html' \
            --exclude='sw-v18.js' \
            --exclude='manifest-v18.webmanifest' \
            --exclude='package-v18.json' \
            ./ _site/
          cp node_modules/matter-js/build/matter.min.js _site/vendor/matter.min.js
          test -s _site/vendor/matter.min.js
          test -s _site/visual-v19.js
          test -s _site/visual-v21.js
          test -s _site/visual-v22.js
          test -s _site/app-v22.js
          test -s _site/v21.css
          test -s _site/v22.css
          grep -q 'data-version="0.4"' _site/blind-is-you/index.html
          grep -q "var VERSION='0.4'" _site/blind-is-you/index.html
          grep -q 'name="biy-presentation" content="2.0"' _site/blind-is-you/index.html
          grep -q 'v11.css?v=2.0.1' _site/blind-is-you/index.html
          grep -q 'v11.js?v=2.0.1' _site/blind-is-you/index.html
          grep -q "var VERSION='2.0'" _site/blind-is-you/v11.js
          grep -q 'Blind Is You v2.0' _site/blind-is-you/v11.css

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
