name: Test and Deploy Adventure Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Expand v20 pixel site
        run: |
          base64 --decode v20-pixel-site.tar.gz.b64 > v20-pixel-site.tar.gz
          echo "fe75d049bab79455a359591ab6bac1773153b28b89d2fc80bf35e1112b45e7f5  v20-pixel-site.tar.gz" | sha256sum --check
          mkdir -p _site
          tar -xzf v20-pixel-site.tar.gz -C _site

      - name: Smoke test v20 pixel build
        run: |
          test -s _site/index.html
          test -s _site/manifest.webmanifest
          test -s _site/sw.js
          test -s _site/icons/icon.svg
          grep -q 'Tomás Pixel Quest' _site/index.html
          grep -q 'canvas id="game" width="320" height="180"' _site/index.html
          grep -q 'image-rendering: pixelated' _site/index.html
          grep -q 'KILLS' _site/index.html
          grep -q 'skeleton' _site/index.html
          grep -q 'monster' _site/index.html
          grep -q 'tomas-pixel-quest-v20' _site/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('_site/index.html').read_text()
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          if not scripts:
              raise SystemExit('No inline game script found')
          Path('/tmp/v20-game.js').write_text(scripts[-1])
          PY
          node --check /tmp/v20-game.js
          echo 'v20 pixel build smoke test passed'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
