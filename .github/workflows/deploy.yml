name: Test and Deploy Adventure Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Expand v16 platformer source
        run: base64 --decode platformer-v16.js.gz.b64 | gzip --decompress > platformer-v16.js

      - name: Expand v17 gameplay overlay
        run: base64 --decode v17-overlay.tar.gz.b64 | tar -xzf -

      - name: Install pinned Matter.js
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run Matter.js smoke test
        run: npm test

      - name: Build static site
        run: |
          mkdir -p _site/vendor
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='*.gz.b64' \
            ./ _site/
          cp node_modules/matter-js/build/matter.min.js _site/vendor/matter.min.js
          test -s _site/vendor/matter.min.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
