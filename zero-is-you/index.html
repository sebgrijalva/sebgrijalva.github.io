<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090b12"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>ZERO IS YOU</title><link rel="manifest" href="./manifest.webmanifest?v=10.0"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css?v=10.0"></head><body><main id="shell"><div id="topbar"><button id="langbtn" class="chip">EN</button><button id="soundbtn" class="chip">SFX ON</button><button id="musicbtn" class="chip">MUSIC OFF</button><button id="parent" class="chip parent">PARENT</button></div><div id="screenwrap"><canvas id="game" width="384" height="448" aria-label="Zero Is You game board"></canvas></div><div id="controls" class="hidden"><div class="actions"><button id="undo" class="big">↶ SNAIL</button><button id="nope" class="big nope" hidden>NOPE</button><button id="lens" class="big lens" hidden>LENS</button><button id="mapbtn" class="big">ISLAND</button></div></div><div id="footer">swipe to move · tap snail = undo · hold snail = hint · hold a word to hear it</div></main><div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div><script type="module">const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),VERSION='10.0';const paint=(title,detail='')=>{ctx.imageSmoothingEnabled=false;ctx.fillStyle='#10182b';ctx.fillRect(0,0,canvas.width,canvas.height);for(let i=0;i<52;i++){const x=(i*97)%384,y=(i*53)%448;ctx.fillStyle=i%5?'#566c86':'#ffcd75';ctx.fillRect(x,y,i%7?1:2,i%7?1:2)}ctx.fillStyle='#ffcd75';ctx.font='bold 28px monospace';ctx.textAlign='center';ctx.fillText(title,canvas.width/2,190);if(detail){ctx.fillStyle='#a9b7cc';ctx.font='bold 12px monospace';(detail.match(/.{1,46}/g)||[]).slice(0,7).forEach((s,i)=>ctx.fillText(s,canvas.width/2,228+i*18))}};const showError=err=>{paint('V10 BOOT ERROR',String(err));let pre=document.querySelector('#booterror');if(!pre){pre=document.createElement('pre');pre.id='booterror';pre.style='color:#ffcd75;background:#090b12;border:2px solid #b13e53;padding:8px;margin:8px;white-space:pre-wrap;font:11px monospace';document.querySelector('#shell').append(pre)}pre.textContent=`ZERO v${VERSION} failed: ${String(err)}\nFalling back to v7…`;return pre};paint('ZERO V10 LOADING');try{if('serviceWorker'in navigator)navigator.serviceWorker.register(`./sw.js?v=${VERSION}`).catch(()=>{});await import(`./game-v9.js?v=${VERSION}`);document.querySelector('#booterror')?.remove()}catch(err){console.error('ZERO v10 boot failed',err);const pre=showError(err);try{await import('./loader-v6.js?v=7.0')}catch(oldErr){console.error('ZERO fallback failed',oldErr);pre.textContent+=`\nFallback failed: ${String(oldErr)}`}}</script></body></html>
