<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#090b12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ZERO IS YOU</title>
  <link rel="manifest" href="./manifest.webmanifest?v=8.1">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=8.1">
</head>
<body>
  <main id="shell">
    <div id="topbar">
      <button id="langbtn" class="chip">EN</button>
      <button id="soundbtn" class="chip">SFX ON</button>
      <button id="musicbtn" class="chip">MUSIC OFF</button>
      <button id="parent" class="chip parent">PARENT</button>
    </div>
    <div id="screenwrap"><canvas id="game" width="384" height="448" aria-label="Zero Is You game board"></canvas></div>
    <div id="controls" class="hidden"><div class="actions"><button id="undo" class="big">↶ SNAIL</button><button id="nope" class="big nope" hidden>NOPE</button><button id="lens" class="big lens" hidden>LENS</button><button id="mapbtn" class="big">ISLAND</button></div></div>
    <div id="footer">swipe to move · tap snail = undo · hold snail = hint · hold a word to hear it</div>
  </main>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
  <script type="module" src="./game-v8.js?v=8.1"></script>
</body>
</html>
