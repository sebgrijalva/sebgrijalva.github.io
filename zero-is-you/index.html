<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#090b12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ZERO IS YOU</title>
  <link rel="manifest" href="./manifest.webmanifest?v=8.3">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=8.3">
</head>
<body>
  <main id="shell">
    <div id="topbar">
      <button id="langbtn" class="chip">EN</button>
      <button id="soundbtn" class="chip">SFX ON</button>
      <button id="musicbtn" class="chip">MUSIC OFF</button>
      <button id="parent" class="chip parent">PARENT</button>
    </div>
    <div id="screenwrap"><canvas id="game" width="384" height="448" aria-label="Zero Is You game board"></canvas></div>
    <div id="controls" class="hidden"><div class="actions"><button id="undo" class="big">↶ SNAIL</button><button id="nope" class="big nope" hidden>NOPE</button><button id="lens" class="big lens" hidden>LENS</button><button id="mapbtn" class="big">ISLAND</button></div></div>
    <div id="footer">swipe to move · tap snail = undo · hold snail = hint · hold a word to hear it</div>
  </main>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
  <script type="module">
    const canvas=document.querySelector('#game');
    const ctx=canvas.getContext('2d');
    const VERSION='8.3';
    const paint=(title,detail='')=>{
      ctx.imageSmoothingEnabled=false;
      ctx.fillStyle='#202943';ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#ffcd75';ctx.font='bold 28px monospace';ctx.textAlign='center';ctx.fillText(title,canvas.width/2,190);
      if(detail){ctx.fillStyle='#a9b7cc';ctx.font='bold 13px monospace';const lines=detail.match(/.{1,44}/g)||[];lines.slice(0,7).forEach((s,i)=>ctx.fillText(s,canvas.width/2,230+i*19));}
    };
    const showError=(err)=>{
      paint('V8 BOOT ERROR',String(err));
      let pre=document.querySelector('#booterror');
      if(!pre){pre=document.createElement('pre');pre.id='booterror';pre.style='color:#ffcd75;background:#090b12;border:2px solid #b13e53;padding:8px;margin:8px;white-space:pre-wrap;font:11px monospace';document.querySelector('#shell').append(pre);}
      pre.textContent=`ZERO v${VERSION} failed: ${String(err)}\nFalling back to v7…`;
      return pre;
    };
    paint('ZERO IS LOADING');
    try{
      if('serviceWorker' in navigator) navigator.serviceWorker.register(`./sw.js?v=${VERSION}`).catch(()=>{});
      const base=new URL('./',location.href);
      const response=await fetch(`./game-v8.js?v=${VERSION}`,{cache:'no-store'});
      if(!response.ok) throw new Error(`game-v8.js HTTP ${response.status}`);
      let source=await response.text();

      // v8.1 accidentally contained repeated top-level renderer helpers. Since each helper
      // is intentionally one source line, keep the first declaration of every function.
      const seenFunctions=new Set();
      source=source.split('\n').filter(line=>{
        const m=line.match(/^function\s+([A-Za-z_$][\w$]*)\s*\(/);
        if(!m) return true;
        if(seenFunctions.has(m[1])) return false;
        seenFunctions.add(m[1]);
        return true;
      }).join('\n');

      // Blob modules have no useful relative base URL, so make static imports absolute.
      source=source.replace(/from\s+(['"])\.\/([^'"]+)\1/g,(all,q,path)=>{
        const u=new URL(path,base);u.searchParams.set('v',VERSION);
        return `from ${q}${u.href}${q}`;
      });
      source += `\n//# sourceURL=zero-is-you-v${VERSION}.js`;
      const moduleURL=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));
      try{await import(moduleURL);}finally{setTimeout(()=>URL.revokeObjectURL(moduleURL),15000);}
      document.querySelector('#booterror')?.remove();
    }catch(err){
      console.error('ZERO v8 boot failed',err);
      const pre=showError(err);
      try{await import('./loader-v6.js?v=7.0');}catch(oldErr){console.error('ZERO v7 fallback failed',oldErr);pre.textContent+=`\nFallback failed: ${String(oldErr)}`;}
    }
  </script>
</body>
</html>
