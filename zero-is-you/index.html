<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#1a1c2c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ZERO IS YOU</title>
  <link rel="manifest" href="./manifest.webmanifest?v=4">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=4">
</head>
<body>
  <main id="shell">
    <div id="topbar">
      <button id="langbtn" class="chip">EN</button>
      <button id="soundbtn" class="chip">SFX ON</button>
      <button id="musicbtn" class="chip">MUSIC OFF</button>
      <button id="parent" class="chip parent">PARENT</button>
    </div>
    <div id="screenwrap"><canvas id="game" width="192" height="224" aria-label="Zero Is You game board"></canvas></div>
    <div id="controls">
      <div id="dpad" class="dpad hidden" aria-label="direction controls">
        <button data-dir="U" class="up">▲</button>
        <button data-dir="L" class="left">◀</button>
        <button data-dir="R" class="right">▶</button>
        <button data-dir="D" class="down">▼</button>
      </div>
      <div class="actions">
        <button id="undo" class="big">↶ SNAIL</button>
        <button id="nope" class="big nope" hidden>NOPE</button>
        <button id="lens" class="big lens" hidden>LENS</button>
        <button id="mapbtn" class="big" hidden>ISLAND</button>
      </div>
    </div>
    <div id="footer">tap snail = undo · hold snail = hint · swipe or d-pad · long-press a word to hear it</div>
  </main>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
  <script type="module" src="./loader-v4.js?v=4"></script>
</body>
</html>
