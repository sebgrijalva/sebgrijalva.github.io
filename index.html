<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#dff4ff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Tomás Adventure Lab</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=15" />
</head>
<body>
  <main id="app">
    <canvas id="toyCanvas" aria-label="Matter.js physics adventure world"></canvas>

    <header id="topBar" class="glass">
      <button id="heroBtn">Hero</button>
      <button id="shipBtn">Ship</button>
      <button id="switchBtn">Switch</button>
      <button id="mapBtn">Map</button>
      <button id="eraserBtn" aria-pressed="false">Erase</button>
      <button id="installBtn">Install</button>
      <button id="resetBtn">Reset</button>
    </header>

    <section id="statusCard" class="glass">
      <strong id="activeLabel">Tomás</strong>
      <span id="mapLabel">Meadow</span>
      <p id="missionText">Explore. Tools and villains are hidden across the map.</p>
      <div id="inventory" aria-label="Unlocked tools">
        <button class="inventory-tool locked" data-tool="magnet" disabled>🧲<small>Magnet</small></button>
        <button class="inventory-tool locked" data-tool="grapple" disabled>↗<small>Grapple</small></button>
        <button class="inventory-tool locked" data-tool="thruster" disabled>✦<small>Thruster</small></button>
      </div>
      <div id="powers" aria-label="Super powers">
        <button class="power-choice selected" data-power="fire">🔥<small>Fire</small></button>
        <button class="power-choice" data-power="ice">❄️<small>Ice</small></button>
        <button class="power-choice" data-power="lightning">⚡<small>Bolt</small></button>
      </div>
    </section>

    <section id="controls">
      <div id="joystick" class="glass" aria-label="Movement joystick"><div id="joystickKnob"></div></div>
      <div id="actionButtons">
        <button id="jumpBtn" class="action-button">BOUNCE</button>
        <button id="powerBtn" class="action-button power">THROW 🔥</button>
        <button id="toolBtn" class="action-button secondary">USE TOOL</button>
      </div>
    </section>

    <dialog id="heroDialog" class="creator-dialog">
      <form method="dialog" id="heroForm">
        <h2>Create your explorer</h2>
        <label>Name<input id="heroName" maxlength="16" value="Tomás" /></label>
        <div class="two-col">
          <label>Kind<select id="heroType"><option value="hero">Superhero</option><option value="robot">Robot</option><option value="alien">Alien</option></select></label>
          <label>Helmet<select id="heroHelmet"><option value="visor">Visor</option><option value="antenna">Antenna</option><option value="open">Open</option></select></label>
          <label>Suit color<input id="heroColor" type="color" value="#3b82f6" /></label>
          <label>Accent<input id="heroAccent" type="color" value="#facc15" /></label>
          <label>Emblem<select id="heroEmblem"><option value="star">Star</option><option value="bolt">Lightning</option><option value="planet">Planet</option></select></label>
          <label class="check"><input id="heroCape" type="checkbox" checked /> Cape</label>
        </div>
        <menu><button value="cancel">Cancel</button><button id="saveHeroBtn" value="default">Save hero</button></menu>
      </form>
    </dialog>

    <dialog id="shipDialog" class="creator-dialog">
      <form method="dialog" id="shipForm">
        <h2>Build your vehicle</h2>
        <label>Name<input id="shipName" maxlength="16" value="Comet" /></label>
        <div class="two-col">
          <label>Hull<select id="shipHull"><option value="rocket">Rocket</option><option value="saucer">Saucer</option><option value="rover">Rover</option></select></label>
          <label>Wings<select id="shipWings"><option value="swept">Swept</option><option value="wide">Wide</option><option value="fins">Fins</option></select></label>
          <label>Body color<input id="shipColor" type="color" value="#ef4444" /></label>
          <label>Trim<input id="shipAccent" type="color" value="#e5e7eb" /></label>
        </div>
        <menu><button value="cancel">Cancel</button><button id="saveShipBtn" value="default">Save ship</button></menu>
      </form>
    </dialog>

    <div id="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="./vendor/matter.min.js?v=15"></script>
  <script>
    (async () => {
      const build = "15";
      try {
        if (localStorage.getItem("family-adventure-build") !== build) {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(registration => registration.unregister()));
          }
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(key => caches.delete(key)));
          }
          localStorage.setItem("family-adventure-build", build);
        }
      } catch { }
      const script = document.createElement("script");
      script.type = "module";
      script.src = "./app.js?v=15";
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
